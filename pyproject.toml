[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "studycopilot"
version = "0.3.2"
description = "Local-first STEM learning context and memory sidebar for Windows"
requires-python = ">=3.11"
dependencies = ["PySide6-Essentials>=6.8,<7"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
studycopilot = "studycopilot.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
studycopilot = ["prompts/*.md", "ui/*.qss"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["desktop: opt-in real Windows desktop input test"]
